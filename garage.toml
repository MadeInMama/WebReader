metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_mode = "none"
rpc_bind_addr = "[::]:3902"
rpc_secret = "${GARAGE_RPC_SECRET}"
admin_bind_addr = "0.0.0.0:3903"
admin_token = "${GARAGE_ADMIN_TOKEN}"

[s3_api]
api_bind_addr = "[::]:3900"
root_domain = "localhost"
s3_region = "garage"
