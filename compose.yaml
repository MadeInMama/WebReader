services:
  webreader:
    image: webreader
    scale: 2
    expose:
      - "80"
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    restart: always
    depends_on:
      - redis
      - db
      - minio
      - nginx
    networks:
      - webreader_network
    user: root

  nginx:
    image: nginx:alpine
    ports:
      - "${PORT_1_1:-80}:${PORT_1_2:-80}"
      - "${PORT_2_1-443}:${PORT_2_2:-443}"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CHAIN}:/etc/nginx/ssl/fullchain.pem:ro
      - ${PRIVATE_KEY}:/etc/nginx/ssl/privkey.pem:ro
      - ./nginx-game.html:/usr/share/nginx/html/nginx-game.html:ro
    restart: always
    networks:
      - webreader_network

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT_1_1:-84}:${REDIS_PORT_1_2:-6379}"
    env_file:
      - ../.env_redis
    volumes:
      #      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly yes
    restart: always
    networks:
      - webreader_network

  db:
    image: postgres:16-alpine
    env_file:
      - ../.env_pg
    ports:
      - "${DB_PORT_1_1}:${DB_PORT_1_2}"
    restart: always
    networks:
      - webreader_network

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_PORT_1_1}:${MINIO_PORT_1_2}"
      - "${MINIO_PORT_2_1}:${MINIO_PORT_2_2}"
    env_file:
      - ../.env_s3
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - webreader_network

#volumes:
#  redis-data:
#    driver: local

networks:
  webreader_network:
    driver: bridge
