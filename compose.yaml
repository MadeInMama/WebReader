services:
  webreader:
    image: webreader
    ports:
      - "${PORT_1_1}:${PORT_1_2}"
      - "${PORT_2_1}:${PORT_2_2}"
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    restart: always
    volumes:
      - ${CHAIN}:/https/fullchain.pem:ro
      - ${PRIVATE_KEY}:/https/privkey.pem:ro
    entrypoint: >
      sh -c "
      echo 'Генерация PFX сертификата...' &&
      openssl pkcs12 -export -out /https/cert.pfx -inkey /https/privkey.pem -in /https/fullchain.pem -passout pass:${Kestrel__Endpoints__Https__Certificate__Password} &&
      echo 'Сертификат успешно создан, запуск приложения...' &&
      exec dotnet WebReader.dll
      "
    depends_on:
      - db
      - minio
    networks:
      - webreader_network
    user: root

  db:
    image: postgres:16-alpine
    env_file:
      - ../.env_pg
    ports:
      - "${DB_PORT_1_1}:${DB_PORT_1_2}"
    restart: always
    networks:
      - webreader_network

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_PORT_1_1}:${MINIO_PORT_1_2}"
      - "${MINIO_PORT_2_1}:${MINIO_PORT_2_2}"
    env_file:
      - ../.env_s3
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - webreader_network

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        echo 'Creating default buckets...' &&
        /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin &&
        /usr/bin/mc mb local/mybucket &&
        echo 'Buckets created successfully!'
      "
    networks:
      - webreader_network

  garage:
    image: dxflrs/garage:v1.0.0
    container_name: garage
    restart: no
    entrypoint: [ ]
    command: /garage -c /etc/garage.toml server
    env_file:
      - ../.env_s3
    ports:
      - "${GARAGE_PORT_1_1}:${GARAGE_PORT_1_2}"
      - "${GARAGE_PORT_3_1}:${GARAGE_PORT_3_2}"
      - "${GARAGE_PORT_4_1}:${GARAGE_PORT_4_2}"
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - GARAGE_REPLICATION_MODE=
      - GARAGE_REPLICATION_LEVEL=
      - GARAGE_CONSISTENCY_MODE=
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ./garage-data/meta:/var/lib/garage/meta
      - ./garage-data/data:/var/lib/garage/data
    networks:
      - webreader_network

  garage-ui:
    image: khairul169/garage-webui:latest
    restart: no
    container_name: garage-webui
    ports:
      - "3909:3909"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro

networks:
  webreader_network:
    driver: bridge
